name: 💰 Build Finanças iOS

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (iPhone real)
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile/FinanceApp.Mobile

    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Usar Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: ⚙️ Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Instalar workloads
        run: dotnet workload install maui ios

      - name: 🔄 Restaurar pacotes
        run: dotnet restore FinanceApp.Mobile.csproj -r ios-arm64

      # IMPORTANTE: ios-arm64 = iPhone de verdade.
      # (iossimulator-arm64 gera um app que SÓ roda no simulador e fecha na hora no iPhone)
      - name: 🏗️ Compilar para iPhone (sem assinatura - assinar depois com Sideloadly/AltStore)
        run: |
          dotnet build FinanceApp.Mobile.csproj \
            -f net9.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:SkipValidateMauiImplicitPackageReferences=true

      - name: 📦 Gerar .ipa
        run: |
          APP=$(find bin/Release/net9.0-ios/ios-arm64 -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          /usr/libexec/PlistBuddy -c "Print :DTPlatformName" "$APP/Info.plist"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qry ../Financas.ipa Payload && cd ..
          ls -lh Financas.ipa

      - name: 📤 Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Financas-ipa
          path: mobile/FinanceApp.Mobile/Financas.ipa
          if-no-files-found: error
          retention-days: 30
