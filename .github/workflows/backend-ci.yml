name: 🧪 Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-test:
    name: Build e Testes (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4

      - name: ⚙️ Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔄 Restaurar
        run: dotnet restore MeuControleFinanceiro.sln

      - name: 🏗️ Compilar
        run: dotnet build MeuControleFinanceiro.sln -c Release --no-restore

      - name: 🧪 Testar
        run: dotnet test MeuControleFinanceiro.sln -c Release --no-build --verbosity normal
